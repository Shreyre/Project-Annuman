              - generic [ref=e234]: Problem statements
              - generic [ref=e239]:
                - generic [ref=e240]:
                  - 'radio "01 AI for Digital Public Infrastructure & Governance Theme: Innovation" [checked]'
                  - generic [ref=e241] [cursor=pointer]:
                    - generic [ref=e242]: "01"
                    - generic [ref=e243]:
                      - generic [ref=e244]: AI for Digital Public Infrastructure & Governance
                      - generic [ref=e245]: "Theme: Innovation"
                  - generic [ref=e250]:
                    - generic [ref=e251]:
                      - generic [ref=e252]: The Problem
                      - paragraph [ref=e253]: Governments across India struggle to consolidate citizen feedback and align it with national infrastructure priorities. Development requests live in fragmented systems, leading to misaligned public spending, unaddressed infrastructure gaps, and no way to measure the impact of large-scale digital public infrastructure initiatives.
                    - generic [ref=e254]:
                      - generic [ref=e255]: The Challenge
                      - paragraph [ref=e256]: Build a scalable, multilingual AI platform — designed as a Digital Public Good — that aggregates citizen development requests via voice, text, and messaging apps across diverse linguistic regions of India. The system should analyse large datasets combining citizen feedback with national demographic data, infrastructure indices, and public investment plans, surfacing demand hotspots and recommending high-priority development projects to national policymakers.
                - generic [ref=e257]:
                  - 'radio "02 Clean Air & Climate Resilience Theme: Sustainability"'
                  - generic [ref=e258] [cursor=pointer]:
                    - generic [ref=e259]: "02"
                    - generic [ref=e260]:
                      - generic [ref=e261]: Clean Air & Climate Resilience
                      - generic [ref=e262]: "Theme: Sustainability"
                  - generic [ref=e266]:
                    - generic [ref=e267]:
                      - generic [ref=e268]: The Problem
                      - paragraph [ref=e269]: Major Indian cities monitor macro-level air quality but consistently miss hyper-local pollution events — industrial emissions, large-scale agricultural burning, seasonal smog. The absence of real-time, granular data prevents coordinated climate action and directly threatens public health.
                    - generic [ref=e270]:
                      - generic [ref=e271]: The Challenge
                      - paragraph [ref=e272]: Build an AI-powered, federated climate action platform that combines citizen-sourced data (photos, local sensor readings) with satellite imagery and meteorological data. It should detect hidden pollution hotspots, forecast air quality spikes across major economic corridors, and alert relevant authorities for rapid intervention — designed for interoperability so Indian cities and states can share predictive models and coordinate resources.
                - generic [ref=e273]:
                  - 'radio "03 Smart Health & Supply Chain Resilience Theme: Resilience"'
                  - generic [ref=e274] [cursor=pointer]:
                    - generic [ref=e275]: "03"
                    - generic [ref=e276]:
                      - generic [ref=e277]: Smart Health & Supply Chain Resilience
                      - generic [ref=e278]: "Theme: Resilience"
                  - generic [ref=e282]:
                    - generic [ref=e283]:
                      - generic [ref=e284]: The Problem
                      - paragraph [ref=e285]: Public healthcare systems across India face persistent supply chain vulnerabilities. The inability to track medicines, patient footfall, and resource utilisation in real time across vast networks of Primary Health Centres leads to stock-outs and limits the country's capacity to respond when it matters most.
                    - generic [ref=e286]:
                      - generic [ref=e287]: The Challenge
                      - paragraph [ref=e288]: Build a federated AI platform for national-scale health resource and supply chain management — real-time visibility into medicine stocks, bed availability, and medical personnel attendance across India's entire PHC network. It should forecast demand, generate early warnings for potential stock-outs during health emergencies, and recommend automated cross-district resource redistribution, while allowing for shared predictive modelling across India's states.
                - generic [ref=e289]:
                  - 'radio "04 Agricultural Intelligence Theme: Cooperation"'
                  - generic [ref=e290] [cursor=pointer]:
                    - generic [ref=e291]: "04"
                    - generic [ref=e292]:
                      - generic [ref=e293]: Agricultural Intelligence
                      - generic [ref=e294]: "Theme: Cooperation"
                  - generic [ref=e298]:
                    - generic [ref=e299]:
                      - generic [ref=e300]: The Problem
                      - paragraph [ref=e301]: Small and marginal farmers across India lack access to data-driven agricultural guidance. Relying on traditional methods instead of satellite data, soil health analytics, and climate forecasting leads to crop failure and threatens food security. The absence of shared digital infrastructure also blocks cross-state collaboration on climate-resilient farming.
                    - generic [ref=e302]:
                      - generic [ref=e303]: The Challenge
                      - paragraph [ref=e304]: Build an interoperable digital agriculture network that delivers real-time, localised agro-advisories using AI. It should offer regenerative crop recommendations based on satellite data, soil health, and weather forecasting, plus a diagnostic tool for crop diseases, and be designed as a scalable digital public good enabling Indian states to share agricultural data models and strengthen cooperation on sustainable food production.
                - generic [ref=e305]:
                  - 'radio "05 Track-Based Cyclone Impact & Infrastructure Vulnerability Forecaster Theme: Resilience"'
                  - generic [ref=e306] [cursor=pointer]:
                    - generic [ref=e307]: "05"
                    - generic [ref=e308]:
                      - generic [ref=e309]: Track-Based Cyclone Impact & Infrastructure Vulnerability Forecaster
                      - generic [ref=e310]: "Theme: Resilience"
                  - generic [ref=e314]:
                    - generic [ref=e315]:
                      - generic [ref=e316]: The Problem
                      - paragraph [ref=e317]: Extreme weather events in the Bay of Bengal and coastal APAC require rapid anticipatory action. Shifting disaster response from post-landfall recovery to pre-landfall evacuation planning, infrastructure hardening, and parametric insurance liquidity saves lives and livelihoods.
                    - generic [ref=e318]:
                      - generic [ref=e319]: The Challenge
                      - paragraph [ref=e320]: Build an AI-powered predictive risk and vulnerability modeling platform utilizing Google Earth Engine (GEE) satellite feeds, real-time meteorological data, and Gemini 3.7 Flash's multimodal reasoning. The solution should simulate cyclone storm surges, predict local rainfall damage pathways, map exposure for critical infrastructure (power grids, arterial roads, medical shelters), and automate early-warning advisory dispatches for local municipal and disaster management authorities.
